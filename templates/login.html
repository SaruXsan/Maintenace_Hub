<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto login-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Admin Access</h1>
        <p class="text-muted">Use AD credentials or local dev admin (if enabled).</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" class="row g-3">
          <div class="col-12"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
          <div class="col-12"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
          <div class="col-12"><button class="btn btn-primary w-100">Login</button></div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
