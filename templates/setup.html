<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Initial Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto setup-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">System Setup (Fail-safe)</h1>
        <p class="text-muted">Configure SQL and admin access. This page works even before database setup.</p>
        {% if message %}
          <div class="alert alert-{{ message_type or 'danger' }}">{{ message }}</div>
        {% endif %}
        <form method="post" class="row g-3">
          <div class="col-md-6"><label class="form-label">DB Host</label><input name="db_host" class="form-control" value="{{ cfg.db_host }}" required></div>
          <div class="col-md-6"><label class="form-label">DB Name</label><input name="db_name" class="form-control" value="{{ cfg.db_name }}" required></div>
          <div class="col-md-6"><label class="form-label">DB User</label><input name="db_user" class="form-control" value="{{ cfg.db_user }}" required></div>
          <div class="col-md-6"><label class="form-label">DB Password</label><input type="password" name="db_password" class="form-control" value="{{ cfg.db_password }}" required></div>
          <div class="col-md-12"><label class="form-label">ODBC Driver</label><input name="db_driver" class="form-control" value="{{ cfg.db_driver }}"></div>
          <div class="col-md-6"><label class="form-label">AD Server</label><input name="ad_server" class="form-control" value="{{ cfg.ad_server }}"></div>
          <div class="col-md-6"><label class="form-label">AD Domain</label><input name="ad_domain" class="form-control" value="{{ cfg.ad_domain }}"></div>
          <div class="col-md-12"><label class="form-label">Telegram Bot Token</label><input name="telegram_bot_token" class="form-control" value="{{ cfg.telegram_bot_token }}"></div>
          <div class="col-md-4"><label class="form-label">AI API URL</label><input name="ai_api_url" class="form-control" value="{{ cfg.ai_api_url }}"></div>
          <div class="col-md-4"><label class="form-label">AI API Key</label><input name="ai_api_key" class="form-control" value="{{ cfg.ai_api_key }}"></div>
          <div class="col-md-4"><label class="form-label">AI Model</label><input name="ai_model" class="form-control" value="{{ cfg.ai_model }}"></div>
          <div class="col-md-6"><label class="form-label">Dev Admin User</label><input name="dev_admin_user" class="form-control" value="{{ cfg.dev_admin_user }}"></div>
          <div class="col-md-6"><label class="form-label">Dev Admin Password</label><input type="password" name="dev_admin_password" class="form-control" value="{{ cfg.dev_admin_password }}"></div>
          <div class="col-12 form-check">
            <input type="checkbox" class="form-check-input" name="dev_mode" {% if cfg.dev_mode %}checked{% endif %}>
            <label class="form-check-label">Enable local full admin for development</label>
          </div>
          <div class="col-12 d-flex flex-wrap gap-2">
            <button class="btn btn-outline-primary" type="submit" name="action" value="test_sql">Test SQL Connection</button>
            <button class="btn btn-secondary" type="submit" name="action" value="save">Save Settings</button>
            <button class="btn btn-primary" type="submit" name="action" value="continue">Continue</button>
            <button class="btn btn-outline-warning" type="submit" name="action" value="create_db">Create DB + Objects (Optional)</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
